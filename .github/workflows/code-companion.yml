name: Code Companion

on:
  pull_request:
    paths:
      - ".github/workflows/code-companion.yml"
      - "docs/code-companion/**"
      - "AGENTS.md"
      - "lib/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs/**"
      - "specs/**"
      - "test/**"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/code-companion.yml"
      - "docs/code-companion/**"
      - "AGENTS.md"
      - "lib/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs/**"
      - "specs/**"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install --requirement requirements-docs.txt
      - run: bash scripts/docs/verify-code-companion.sh
